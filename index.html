<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AR ADAbot</title>
<meta name="description" content="ADAbot dan ADAprime dalam AR: scan lantai, ADAbot keluar, kawal dia, ubah saiz, jadi ADAprime dan menari.">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1B21">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<video id="cam" playsinline muted autoplay hidden></video>
<div id="stage" aria-hidden="true"></div>

<section id="start" class="start">
  <div class="card">
    <div class="stripe" aria-hidden="true"></div>
    <h1>AR ADAbot</h1>
    <p>Halakan kamera ke lantai, ADAbot keluar. Gerakkan dia dengan joystick atau ketik lantai, ubah saiz, dan tukar jadi <b>ADAprime</b> yang boleh menari.</p>
    <button id="btnStart" class="primary big" disabled>Memuatkan…</button>
    <p id="startNote" class="note"></p>
  </div>
</section>

<div id="hud" class="hud" hidden>
  <div class="top">
    <button id="btnExit" class="round ui" aria-label="Keluar">✕</button>
    <div id="hint" class="hint" aria-live="polite"></div>
    <button id="btnMove" class="round ui" aria-label="Alih ke tempat lain" title="Alih ke tempat lain" hidden>⌖</button>
    <button id="btnMute" class="round ui" aria-label="Bunyi">🔊</button>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="controls" class="controls" hidden>
    <div class="sizebar ui">
      <label for="size">Saiz</label>
      <input type="range" id="size" min="5" max="200" step="1" value="100">
      <b id="sizeVal">100%</b>
    </div>
    <button id="btnPrime" class="prime ui">⚡ Jadi ADAprime</button>
    <div class="bottom">
      <div id="stick" class="stick ui" aria-label="Joystick"><div id="knob" class="knob"></div></div>
      <div id="actions" class="actions ui"></div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
